<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>우리동네 스팟 공유</title>
    
    <!-- PWA Manifest & Service Worker 동적 생성 -->
    <link rel="manifest" id="manifest-link">
    <script>
        const manifest = {
            "name": "우리동네 스팟 공유",
            "short_name": "스팟공유",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#f3f4f6",
            "theme_color": "#ffffff",
            "icons": [{
                "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSI1MCIgZmlsbD0iI2VmNDQ0NCIvPjx0ZXh0IHg9IjUwIiB5PSI2NCIgZm9udC1zaXplPSI0MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0id2hpdGUiIHBvaW50ZXItZXZlbnRzPSJub25lIj7wn42tPC90ZXh0Pjwvc3ZnPg==",
                "sizes": "512x512",
                "type": "image/svg+xml",
                "purpose": "any maskable"
            }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);
        
        if ('serviceWorker' in navigator) {
            const swCode = `self.addEventListener('fetch', function(e) {});`;
            const swBlob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(console.error);
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { 
            margin: 0; padding: 0; 
            overscroll-behavior-y: none;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            background-color: #f3f4f6;
        }
        .app-container {
            height: 100vh; height: 100dvh; 
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #map { 
            flex-grow: 1; 
            width: 100%; 
            z-index: 10;
            filter: contrast(0.95) saturate(0.85) brightness(1.05);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 핀 애니메이션 */
        .marker-pulse { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* 리플릿 마커 기본 사각 배경 제거 */
        .leaflet-div-icon {
            background: transparent !important;
            border: none !important;
        }

        /* 내 위치 파란 점 펄스 효과 */
        .my-location-pulse {
            animation: myLocPulse 2s infinite;
        }
        @keyframes myLocPulse {
            0% { transform: scale(0.95); opacity: 0.9; }
            50% { transform: scale(1.3); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.9; }
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- 상단 UI (클릭 영역 정밀 분리) -->
    <div class="absolute top-0 left-0 right-0 z-[50] pt-[env(safe-area-inset-top)] pointer-events-none">
        <div class="px-4 pt-4 pb-2 flex flex-col gap-3">
            
            <!-- 검색창 및 비밀 로그인 -->
            <div class="flex justify-between items-center gap-2 pointer-events-auto">
                <div class="flex-1 relative">
                    <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-sm border border-gray-100 flex items-center px-4 py-3 relative">
                        <!-- 돋보기 아이콘 (3번 누르면 비밀 로그인) -->
                        <button id="secret-login-btn" class="mr-3 text-gray-500 focus:outline-none flex-shrink-0 relative">
                            <svg class="w-5 h-5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </button>
                        <input type="text" id="searchInput" placeholder="장소명 또는 태그 검색" class="w-full outline-none text-[15px] bg-transparent text-gray-800 placeholder-gray-400">
                        <!-- 검색어 한 번에 지우기 버튼 -->
                        <button id="clear-search-btn" class="hidden text-gray-400 hover:text-gray-600 focus:outline-none ml-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>

                    <!-- 실시간 연관 검색 결과 리스트 드롭다운 -->
                    <div id="search-results-dropdown" class="hidden absolute top-full left-0 right-0 mt-2 bg-white/95 backdrop-blur-md rounded-2xl shadow-xl border border-gray-100 max-h-[60vh] overflow-y-auto no-scrollbar z-[60] divide-y divide-gray-100">
                    </div>
                </div>
                
                <!-- 언어 선택 버튼 -->
                <button id="lang-select-btn" class="bg-white/95 backdrop-blur-md rounded-2xl shadow-sm px-3.5 py-3 flex items-center gap-1.5 border border-gray-100 text-xs font-bold text-gray-700 hover:bg-gray-50 active:bg-gray-100 transition flex-shrink-0">
                    <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path></svg>
                    <span id="current-lang-text">KO</span>
                </button>

                <!-- 제작자 모드 토글 (초기 숨김) -->
                <div id="creator-toggle-container" class="hidden bg-white/95 backdrop-blur-md rounded-2xl shadow-sm px-4 py-3 flex items-center gap-2 border border-gray-100">
                    <span id="creator-toggle-label" class="text-xs font-bold text-red-600">제작자</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="creatorModeToggle" class="sr-only peer">
                        <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-red-500"></div>
                    </label>
                </div>
            </div>

            <!-- 카테고리 칩 -->
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pointer-events-auto pb-1" id="categoryChips">
                <!-- JS 렌더링 -->
            </div>
        </div>
    </div>

    <!-- 십자선 (위치 지정) -->
    <div id="crosshair" class="hidden absolute inset-0 z-[40] flex items-center justify-center pointer-events-none">
        <div class="w-12 h-12 border-2 border-red-500 rounded-full flex items-center justify-center bg-red-500/20">
            <div class="w-2 h-2 bg-red-600 rounded-full"></div>
        </div>
    </div>

    <!-- 지도 본체 -->
    <div id="map"></div>

    <!-- 내 위치 (GPS) 버튼 -->
    <div class="absolute bottom-24 right-4 z-[40] pointer-events-auto pb-[env(safe-area-inset-bottom)]">
        <button id="my-location-btn" class="bg-white/95 backdrop-blur-md text-gray-700 w-12 h-12 rounded-2xl shadow-md flex items-center justify-center border border-gray-100 active:scale-95 transition" title="내 위치">
            <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2v3m0 14v3M2 12h3m14 0h3m-4.93-7.07l-2.12 2.12M7.05 16.95l-2.12 2.12m0-14.14l2.12 2.12m9.9 9.9l2.12 2.12M12 17a5 5 0 100-10 5 5 0 000 10z"></path>
            </svg>
        </button>
    </div>

    <!-- 제작자용 FAB -->
    <div id="creator-fab" class="hidden absolute bottom-6 right-4 z-[50] pointer-events-auto pb-[env(safe-area-inset-bottom)]">
        <button id="addPlaceBtn" class="bg-red-600 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-3xl font-light marker-pulse">
            +
        </button>
    </div>

    <!-- 위치 확정 FAB -->
    <div id="confirm-location-fab" class="hidden absolute bottom-8 left-1/2 transform -translate-x-1/2 z-[50] pointer-events-auto pb-[env(safe-area-inset-bottom)] w-[90%] max-w-sm">
        <button id="confirmLocationBtn" class="w-full bg-blue-600 text-white py-4 rounded-full shadow-lg text-lg font-bold">
            📍 이 위치로 지정하기
        </button>
    </div>

</div>

<!-- ========================================== -->
<!-- 모달 및 바텀시트 -->
<!-- ========================================== -->

<!-- 커스텀 다이얼로그 (alert/confirm 대체용) -->
<div id="custom-dialog" class="hidden fixed inset-0 z-[10000] bg-black/60 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-3xl w-full max-w-[280px] p-6 text-center shadow-2xl">
        <h2 id="dialog-title" class="text-lg font-bold mb-2 text-gray-900">알림</h2>
        <p id="dialog-msg" class="text-sm text-gray-600 mb-6"></p>
        <div class="flex gap-2 justify-center">
            <button id="dialog-cancel-btn" class="hidden flex-1 py-3 bg-gray-100 text-gray-700 rounded-xl text-sm font-bold active:bg-gray-200">취소</button>
            <button id="dialog-ok-btn" class="flex-1 py-3 bg-blue-600 text-white rounded-xl text-sm font-bold shadow-md active:bg-blue-700">확인</button>
        </div>
    </div>
</div>

<!-- 비밀번호 입력 팝업 -->
<div id="password-modal" class="hidden fixed inset-0 z-[9999] bg-black/50 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-3xl w-full max-w-xs p-6 text-center shadow-xl">
        <h2 class="text-lg font-bold mb-2">제작자 모드 인증</h2>
        <p class="text-sm text-gray-500 mb-5">비밀번호를 입력해주세요.</p>
        <input type="password" id="admin-password" class="w-full bg-gray-50 p-3 rounded-xl text-center text-xl tracking-widest mb-5 outline-none focus:border-blue-500 border border-gray-200" placeholder="비밀번호 입력">
        <div class="flex gap-2">
            <button id="close-password-btn" class="flex-1 py-3 bg-gray-200 text-gray-700 rounded-xl font-bold">취소</button>
            <button id="submit-password-btn" class="flex-1 py-3 bg-red-500 text-white rounded-xl font-bold">확인</button>
        </div>
    </div>
</div>

<!-- 다국어 언어 선택 팝업 모달 -->
<div id="lang-modal" class="hidden fixed inset-0 z-[10000] bg-black/60 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-3xl w-full max-w-xs p-6 text-center shadow-2xl">
        <h2 class="text-lg font-bold mb-1 text-gray-900" id="lang-modal-title">언어 설정 (Language)</h2>
        <p class="text-xs text-gray-400 mb-5">Select your preferred language</p>
        <div class="space-y-2">
            <button class="w-full py-3 px-4 rounded-xl border border-gray-100 flex items-center justify-between font-bold text-sm hover:bg-gray-50 active:bg-gray-100 transition" onclick="selectLanguage('ko')">
                <span class="flex items-center gap-2">🇰🇷 한국어</span>
                <span id="check-ko" class="text-blue-600 text-sm">✓</span>
            </button>
            <button class="w-full py-3 px-4 rounded-xl border border-gray-100 flex items-center justify-between font-bold text-sm hover:bg-gray-50 active:bg-gray-100 transition" onclick="selectLanguage('en')">
                <span class="flex items-center gap-2">🇺🇸 English</span>
                <span id="check-en" class="text-blue-600 text-sm hidden">✓</span>
            </button>
            <button class="w-full py-3 px-4 rounded-xl border border-gray-100 flex items-center justify-between font-bold text-sm hover:bg-gray-50 active:bg-gray-100 transition" onclick="selectLanguage('ja')">
                <span class="flex items-center gap-2">🇯🇵 日本語</span>
                <span id="check-ja" class="text-blue-600 text-sm hidden">✓</span>
            </button>
            <button class="w-full py-3 px-4 rounded-xl border border-gray-100 flex items-center justify-between font-bold text-sm hover:bg-gray-50 active:bg-gray-100 transition" onclick="selectLanguage('zh')">
                <span class="flex items-center gap-2">🇨🇳 简体中文</span>
                <span id="check-zh" class="text-blue-600 text-sm hidden">✓</span>
            </button>
        </div>
        <button id="close-lang-btn" class="mt-4 w-full py-2.5 bg-gray-100 text-gray-600 rounded-xl text-xs font-bold active:bg-gray-200 transition">
            닫기 (Close)
        </button>
    </div>
</div>

<!-- 바텀시트 -->
<div id="bottom-sheet" class="fixed bottom-0 left-0 right-0 z-[100] bg-white rounded-t-3xl shadow-[0_-5px_20px_rgba(0,0,0,0.15)] transform translate-y-full transition-transform duration-300 pb-[env(safe-area-inset-bottom)] max-h-[85vh] flex flex-col hidden">
    <div class="flex justify-center p-4 cursor-pointer" id="sheet-handle">
        <div class="w-12 h-1.5 bg-gray-300 rounded-full"></div>
    </div>
    
    <div class="overflow-y-auto px-5 pb-8 flex-1">
        <!-- 제작자 도구 -->
        <div id="sheet-admin-controls" class="hidden flex justify-end gap-2 mb-3">
            <button id="edit-place-btn" class="text-xs bg-gray-100 text-gray-700 px-3 py-1.5 rounded-lg font-bold">수정</button>
            <button id="delete-place-btn" class="text-xs bg-red-100 text-red-600 px-3 py-1.5 rounded-lg font-bold">삭제</button>
        </div>

        <div class="flex items-center gap-2 mb-2">
            <span id="sheet-category" class="text-xs font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-md"></span>
        </div>
        <h2 id="sheet-title" class="text-2xl font-bold mb-5 text-gray-900"></h2>

        <!-- 사진 -->
        <div id="sheet-photo-container" class="relative w-full h-56 bg-gray-100 rounded-2xl overflow-hidden mb-5 hidden shadow-sm cursor-pointer border border-gray-200">
            <img id="sheet-photo" class="w-full h-full object-cover" src="" alt="첨부 사진">
            <div class="absolute bottom-3 right-3 bg-black/70 text-white text-[11px] font-bold px-3 py-1.5 rounded-full flex items-center gap-1 backdrop-blur-md">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <span id="sheet-photo-badge">자세히 보기</span>
            </div>
        </div>

        <!-- 링크 -->
        <a id="sheet-link-btn" href="#" target="_blank" class="w-full block bg-red-50 text-red-600 text-center py-4 rounded-xl font-bold border border-red-100 shadow-sm active:bg-red-100 transition">
            🎬 영상 / 링크 바로가기
        </a>
    </div>
    <button id="close-sheet-btn" class="absolute top-4 right-4 w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 font-bold">✕</button>
</div>

<!-- 라이트박스 -->
<div id="lightbox" class="hidden fixed inset-0 z-[9999] bg-black/95 flex flex-col justify-center items-center">
    <button id="lightbox-close" class="absolute top-[env(safe-area-inset-top)] right-4 mt-4 w-10 h-10 bg-white/20 text-white rounded-full flex items-center justify-center text-xl font-bold pointer-events-none">✕</button>
    <img id="lightbox-img" class="w-full h-auto max-h-screen object-contain pointer-events-none" src="">
</div>

<!-- 폼 모달 -->
<div id="place-form-modal" class="hidden fixed inset-0 z-[200] bg-black/50 flex items-end justify-center sm:items-center">
    <div class="bg-white w-full max-w-md h-[90vh] sm:h-auto sm:max-h-[90vh] rounded-t-3xl sm:rounded-3xl flex flex-col shadow-2xl">
        <div class="p-5 border-b border-gray-100 flex justify-between items-center">
            <h3 class="text-lg font-bold" id="form-modal-title">장소 등록</h3>
            <button id="close-form-btn" class="text-gray-400 text-2xl">✕</button>
        </div>
        <div class="p-5 overflow-y-auto flex-1 pb-[env(safe-area-inset-bottom)]">
            
            <label class="block text-sm font-bold text-gray-700 mb-1.5">장소명</label>
            <input type="text" id="input-title" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3.5 mb-5 outline-none focus:border-blue-500 focus:bg-white transition" placeholder="예) GS25 낙성대역점">

            <div class="flex justify-between items-end mb-1.5">
                <label class="block text-sm font-bold text-gray-700">카테고리</label>
                <button id="open-category-admin" class="text-xs text-blue-600 bg-blue-50 px-2 py-1 rounded">관리하기</button>
            </div>
            <select id="input-category" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3.5 mb-5 outline-none focus:border-blue-500 focus:bg-white transition">
                <!-- 동적 렌더링 -->
            </select>

            <label class="block text-sm font-bold text-gray-700 mb-1.5">영상 / 연결 링크</label>
            <input type="text" id="input-link" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3.5 mb-5 outline-none focus:border-blue-500 focus:bg-white transition" placeholder="유튜브, 인스타, 웹사이트 링크 등">

            <label class="block text-sm font-bold text-gray-700 mb-1.5">사진 첨부 (선택)</label>
            <div class="w-full bg-gray-50 border-2 border-dashed border-gray-200 rounded-2xl p-5 text-center mb-8 relative">
                <input type="file" id="input-photo" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                <div id="photo-preview-container" class="hidden">
                    <img id="photo-preview" class="max-h-40 mx-auto rounded-lg mb-2 shadow-sm">
                    <span class="text-xs text-red-500 font-bold bg-red-50 px-2 py-1 rounded">터치하여 다른 사진으로 변경</span>
                </div>
                <div id="photo-placeholder" class="text-gray-400">
                    <div class="text-3xl mb-2">📷</div>
                    <div class="text-sm font-bold">터치하여 사진 올리기</div>
                </div>
            </div>

            <button id="save-place-btn" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl text-lg shadow-md active:bg-blue-700">
                저장하기
            </button>
        </div>
    </div>
</div>

<!-- 카테고리 관리 모달 -->
<div id="category-admin-modal" class="hidden fixed inset-0 z-[300] bg-black/50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl">
        <div class="flex justify-between items-center mb-5">
            <h3 class="text-lg font-bold">카테고리 관리</h3>
            <button id="close-category-admin-btn" class="text-gray-400 text-xl">✕</button>
        </div>
        <div class="flex gap-2 mb-5 items-stretch">
            <input type="text" id="new-category-input" class="flex-1 min-w-0 bg-gray-50 border border-gray-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-blue-500 focus:bg-white transition" placeholder="새 카테고리명">
            <button id="add-category-btn" class="flex-shrink-0 bg-gray-800 text-white px-4 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap active:bg-gray-700 transition">추가</button>
        </div>
        <ul id="category-admin-list" class="max-h-60 overflow-y-auto space-y-2 border-t border-gray-100 pt-4">
            <!-- 동적 렌더링 -->
        </ul>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {

    /* --- 커스텀 다이얼로그 함수 (alert, confirm 대체) --- */
    window.customAlert = (msg) => {
        document.getElementById('dialog-title').textContent = '알림';
        document.getElementById('dialog-msg').textContent = msg;
        document.getElementById('dialog-cancel-btn').classList.add('hidden');
        document.getElementById('dialog-ok-btn').onclick = () => document.getElementById('custom-dialog').classList.add('hidden');
        document.getElementById('custom-dialog').classList.remove('hidden');
    };

    window.customConfirm = (msg, onConfirm) => {
        document.getElementById('dialog-title').textContent = '확인';
        document.getElementById('dialog-msg').textContent = msg;
        document.getElementById('dialog-cancel-btn').classList.remove('hidden');
        document.getElementById('dialog-cancel-btn').onclick = () => document.getElementById('custom-dialog').classList.add('hidden');
        document.getElementById('dialog-ok-btn').onclick = () => {
            document.getElementById('custom-dialog').classList.add('hidden');
            onConfirm();
        };
        document.getElementById('custom-dialog').classList.remove('hidden');
    };

    /* --- 데이터 초기화 --- */
    let places = JSON.parse(localStorage.getItem('places')) || [];
    let categories = JSON.parse(localStorage.getItem('categories')) || ['전체', 'GS25', '카페', '식당', '쇼핑', '문화', '핫플'];
    let currentFilter = '전체';
    
    let isCreatorMode = false;
    let creatorUnlocked = false;
    let editingId = null;
    let pickingLocation = false;

    // 카테고리 다국어 기본 사전

    // 번역 메모리 캐시 (반복 호출 방지)
    const translationCache = { en: {}, ja: {}, zh: {} };

    let currentLang = localStorage.getItem('app_lang') || 'ko';
    function t(key) {
        return (translations[currentLang] && translations[currentLang][key]) || translations['ko'][key] || '';
    }

    // 장소명/카테고리 자동 번역 함수
    async function translateDynamicText(text, targetLang) {
        if (!text || targetLang === 'ko') return text;
        
        // 1. 사전 매핑 확인
        if (categoryDict[text] && categoryDict[text][targetLang]) {
            return categoryDict[text][targetLang];
        }
        // 2. 캐시 확인
        if (translationCache[targetLang] && translationCache[targetLang][text]) {
            return translationCache[targetLang][text];
        }

        // 3. 실시간 번역 API 호출 (Google Translate Free Endpoint)
        try {
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
            if (res.ok) {
                const data = await res.json();
                if (data && data[0] && data[0][0] && data[0][0][0]) {
                    const translated = data[0][0][0];
                    if (!translationCache[targetLang]) translationCache[targetLang] = {};
                    translationCache[targetLang][text] = translated;
                    return translated;
                }
            }
        } catch (e) {
            console.warn('번역 API 일시적 오류:', e);
        }
        return text;
    }

    // 동기식 표시용(캐시/사전 우선 반환)
    function getDisplayCategory(cat) {
        if (currentLang === 'ko') return cat;
        if (cat === '전체') return t('all');
        if (categoryDict[cat] && categoryDict[cat][currentLang]) return categoryDict[cat][currentLang];
        return (translationCache[currentLang] && translationCache[currentLang][cat]) || cat;
    }

    function getDisplayTitle(title) {
        if (currentLang === 'ko') return title;
        return (translationCache[currentLang] && translationCache[currentLang][title]) || title;
    }

    async function applyTranslations() {
        document.getElementById('current-lang-text').textContent = t('langCode');
        document.getElementById('searchInput').placeholder = t('searchPlaceholder');
        document.getElementById('creator-toggle-label').textContent = t('creator');
        document.getElementById('confirmLocationBtn').textContent = t('confirmLocation');
        document.getElementById('sheet-link-btn').textContent = t('openLink');
        document.getElementById('edit-place-btn').textContent = t('edit');

        if (badge) badge.textContent = t('viewDetail');
        
        // 언어 팝업 체크 표시 갱신
        ['ko', 'en', 'ja', 'zh'].forEach(code => {
            const checkEl = document.getElementById(`check-${code}`);
            if (checkEl) checkEl.classList.toggle('hidden', currentLang !== code);
        });

        // 장소명 및 카테고리 비동기 번역 일괄 실행
        if (currentLang !== 'ko') {
            const textsToTranslate = new Set();
            categories.forEach(c => { if(c !== '전체') textsToTranslate.add(c); });
            places.forEach(p => {
                if(p.title) textsToTranslate.add(p.title);
                if(p.category) textsToTranslate.add(p.category);
            });

            await Promise.all(Array.from(textsToTranslate).map(txt => translateDynamicText(txt, currentLang)));
        }

        renderCategories();
        renderMarkers();
        if (currentOpenPlace) {
            openBottomSheet(currentOpenPlace);
        }

    /* --- 내 위치 (GPS) 기능 --- */
    let myLocMarker = null;
    let myLocCircle = null;

    document.getElementById('my-location-btn').addEventListener('click', () => {
        if (!navigator.geolocation) {
            customAlert(t('geoNotSupported'));
            return;
        }

        const btn = document.getElementById('my-location-btn');
        btn.classList.add('opacity-50');

        const successCallback = (pos) => {
            btn.classList.remove('opacity-50');
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const accuracy = pos.coords.accuracy;

            if (myLocMarker) map.removeLayer(myLocMarker);
            if (myLocCircle) map.removeLayer(myLocCircle);

            myLocCircle = L.circle([lat, lng], {
                radius: accuracy,
                color: '#3b82f6',
                fillColor: '#3b82f6',
                fillOpacity: 0.12,
                weight: 1
            }).addTo(map);

            const myLocIcon = L.divIcon({
                html: `
                    <div class="relative w-6 h-6 flex items-center justify-center">
                        <div class="absolute w-6 h-6 bg-blue-500 rounded-full opacity-30 my-location-pulse"></div>
                        <div class="w-4 h-4 bg-blue-600 rounded-full border-2 border-white shadow-md"></div>
                    </div>
                `,
                className: 'custom-div-icon',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });

            myLocMarker = L.marker([lat, lng], { icon: myLocIcon, zIndexOffset: 1000 }).addTo(map);
            map.flyTo([lat, lng], 17, { animate: true, duration: 1.0 });
        };

        const handleError = (err) => {
            btn.classList.remove('opacity-50');
            let errorMsg = t('geoError');
            
            // 실제 이용자 지향적인 에러 핸들링 (언어별 자동 적용)
            switch(err.code) {
                case err.PERMISSION_DENIED:
                    errorMsg = t('geoPermissionDenied');
                    break;
                case err.POSITION_UNAVAILABLE:
                    errorMsg = t('geoPositionUnavailable');
                    break;
                case err.TIMEOUT:
                    errorMsg = t('geoTimeout');
                    break;
            }
            customAlert(errorMsg);
        };

        // 1차 고정밀도 시도 -> 실패 시 2차 저정밀도(기지국/Wi-Fi) 자동 Fallback
        navigator.geolocation.getCurrentPosition(
            successCallback,
            (err) => {
                // 고정밀도 타임아웃 또는 신호 약세 시 저정밀도로 재시도
                if (err.code === err.TIMEOUT || err.code === err.POSITION_UNAVAILABLE) {
                    navigator.geolocation.getCurrentPosition(
                        successCallback,
                        handleError,
                        { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 }
                    );
                } else {
                    // 권한 거부 등 기타 에러
                    handleError(err);
                }
            },
            { enableHighAccuracy: true, timeout: 7000, maximumAge: 0 }
        );
    });

    /* --- 카테고리 & 마커 렌더링 --- */
    function renderCategories() {
        const chipsContainer = document.getElementById('categoryChips');
        chipsContainer.innerHTML = '';
        
        categories.forEach(cat => {
            const btn = document.createElement('button');
            const isActive = currentFilter === cat;
            
            btn.className = `whitespace-nowrap px-4 py-2.5 rounded-full text-sm font-bold shadow-sm transition-all border ${
                isActive ? 'bg-gray-800 text-white border-gray-800' : 'bg-white/90 backdrop-blur-md text-gray-700 border-gray-200/80'
            }`;
            
            let count = (cat === '전체') ? places.length : places.filter(p => p.category === cat).length;
            const displayCat = getDisplayCategory(cat);
            const catLabel = cat === '전체' ? displayCat : '#' + displayCat;
            btn.innerHTML = `${catLabel} <span class="${isActive ? 'text-gray-300' : 'text-gray-400'} text-xs ml-1">${count}</span>`;
            
            btn.onclick = () => {
                currentFilter = cat;
                renderCategories();
                renderMarkers();
                closeBottomSheet();
            };
            chipsContainer.appendChild(btn);
        });

        const select = document.getElementById('input-category');
        select.innerHTML = categories.filter(c => c !== '전체').map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function getCustomIcon(place) {
        const avatarHtml = place.image ? 
            `<div class="w-[50px] h-[50px] rounded-full border-[3px] border-white shadow-lg overflow-hidden relative bg-gray-200 flex-shrink-0">
                <img src="${place.image}" class="w-full h-full object-cover"/>
                <div class="absolute bottom-0 right-0 bg-red-500 rounded-full w-4 h-4 flex items-center justify-center border border-white">
                    <span class="text-[8px] text-white ml-[0.5px]">▶</span>
                </div>
            </div>` : 
            `<div class="w-10 h-10 bg-red-500 rounded-full border-2 border-white shadow-md flex items-center justify-center text-white text-sm flex-shrink-0">
                ▶
            </div>`;

        const translateY = place.image ? '-25px' : '-20px';
        const displayTitle = getDisplayTitle(place.title);

        const htmlStr = `
            <div class="flex flex-col items-center cursor-pointer select-none" style="transform: translate(-50%, ${translateY}); width: 140px;">
                ${avatarHtml}
                <div class="mt-1 bg-gray-900/85 backdrop-blur-sm text-white text-[11px] font-bold px-2.5 py-0.5 rounded-full shadow-[0_2px_6px_rgba(0,0,0,0.35)] max-w-[130px] truncate border border-white/20 text-center tracking-tight">
                    ${displayTitle}
                </div>
            </div>
        `;
        
        return L.divIcon({
            html: htmlStr,
            className: 'custom-div-icon',
            iconSize: [0, 0],
            iconAnchor: [0, 0]
        });
    }

    function renderMarkers() {
        markersLayer.clearLayers();
        let filtered = currentFilter === '전체' ? places : places.filter(p => p.category === currentFilter);
        filtered.forEach(place => {
            const marker = L.marker([place.lat, place.lng], { icon: getCustomIcon(place) });
            marker.on('click', () => openBottomSheet(place));
            markersLayer.addLayer(marker);
        });
    }

        document.getElementById('sheet-category').textContent = getDisplayCategory(place.category);

        else { linkBtn.style.display = 'none'; }

            document.getElementById('sheet-photo').src = place.image;
            photoCont.classList.remove('hidden');

    /* --- 사진 압축 (Canvas) --- */
    document.getElementById('input-photo').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                let width = img.width, height = img.height;
                if (width > 800) { height *= 800 / width; width = 800; }
                canvas.width = width; canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);
                tempCompressedImage = canvas.toDataURL('image/jpeg', 0.8);
                
                document.getElementById('photo-preview').src = tempCompressedImage;
                document.getElementById('photo-preview-container').classList.remove('hidden');
                document.getElementById('photo-placeholder').classList.add('hidden');
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    function resetPhotoUpload() {
        document.getElementById('input-photo').value = '';
        tempCompressedImage = null;
        document.getElementById('photo-preview-container').classList.add('hidden');
        document.getElementById('photo-placeholder').classList.remove('hidden');
    }

        const link = document.getElementById('input-link').value.trim();

        if(!title) { customAlert('장소명을 입력해주세요.'); return; }
        if(!link) { customAlert('링크를 입력해주세요.'); return; }

        if (editingId) {
            const idx = places.findIndex(p => p.id === editingId);
            if(idx > -1) {
                places[idx].title = title; places[idx].category = category; places[idx].link = link;
                if(currentTempLocation) { places[idx].lat = currentTempLocation.lat; places[idx].lng = currentTempLocation.lng; }
                if(tempCompressedImage) places[idx].image = tempCompressedImage;
            }
        } else {
            places.push({ id: Date.now(), lat: currentTempLocation.lat, lng: currentTempLocation.lng, title, category, link, image: tempCompressedImage });
        }

        localStorage.setItem('places', JSON.stringify(places));
        document.getElementById('place-form-modal').classList.add('hidden');
        renderCategories(); renderMarkers();
    });

    document.getElementById('edit-place-btn').addEventListener('click', () => {
        if(!currentOpenPlace) return;
        editingId = currentOpenPlace.id;

        document.getElementById('form-modal-title').textContent = "장소 수정";

        document.getElementById('input-category').value = currentOpenPlace.category;
        document.getElementById('input-link').value = currentOpenPlace.link;
        resetPhotoUpload();

            document.getElementById('photo-preview').src = currentOpenPlace.image;
            document.getElementById('photo-preview-container').classList.remove('hidden');
            document.getElementById('photo-placeholder').classList.add('hidden');
        }
        closeBottomSheet();
        document.getElementById('place-form-modal').classList.remove('hidden');
    });

    document.getElementById('delete-place-btn').addEventListener('click', () => {
        if(!currentOpenPlace) return;
        customConfirm(`'${currentOpenPlace.title}' 장소를 삭제하시겠습니까?`, () => {
            places = places.filter(p => p.id !== currentOpenPlace.id);
            localStorage.setItem('places', JSON.stringify(places));
            closeBottomSheet(); renderCategories(); renderMarkers();
        });
    });

    /* --- 카테고리 관리 --- */
    document.getElementById('open-category-admin').addEventListener('click', () => {
        document.getElementById('category-admin-modal').classList.remove('hidden');
        renderCategoryAdmin();
    });
    document.getElementById('close-category-admin-btn').addEventListener('click', () => {
        document.getElementById('category-admin-modal').classList.add('hidden');
        renderCategories();
    });

    function renderCategoryAdmin() {
        const list = document.getElementById('category-admin-list');
        list.innerHTML = '';
        categories.forEach(cat => {
            if(cat === '전체') return;
            const li = document.createElement('li');
            li.className = 'flex justify-between items-center bg-white border border-gray-100 p-2.5 rounded-xl gap-2';
            li.innerHTML = `
                <input type="text" value="${cat}" class="flex-1 min-w-0 bg-transparent outline-none font-bold text-gray-700 text-sm" id="cat-edit-${cat}">
                <div class="flex gap-1.5 flex-shrink-0">
                    <button class="text-xs bg-gray-100 text-gray-700 px-2.5 py-1.5 rounded-lg font-bold whitespace-nowrap" onclick="updateCategory('${cat}')">수정</button>
                    <button class="text-xs bg-red-50 text-red-600 px-2.5 py-1.5 rounded-lg font-bold whitespace-nowrap" onclick="deleteCategory('${cat}')">삭제</button>
                </div>`;
            list.appendChild(li);
        });
    }

    document.getElementById('add-category-btn').addEventListener('click', () => {
        const val = document.getElementById('new-category-input').value.trim();
        if(val && !categories.includes(val)) {
            categories.push(val); localStorage.setItem('categories', JSON.stringify(categories));
            document.getElementById('new-category-input').value = ''; renderCategoryAdmin();
        }
    });

    window.updateCategory = (oldCat) => {
        const val = document.getElementById(`cat-edit-${oldCat}`).value.trim();
        if(val && val !== oldCat && !categories.includes(val)) {
            categories[categories.indexOf(oldCat)] = val;
            places.forEach(p => { if(p.category === oldCat) p.category = val; });
            localStorage.setItem('categories', JSON.stringify(categories));
            localStorage.setItem('places', JSON.stringify(places));
            renderCategoryAdmin();
        }
    };

    window.deleteCategory = (cat) => {
        customConfirm(`'${cat}' 카테고리를 삭제할까요?`, () => {
            categories = categories.filter(c => c !== cat);
            places.forEach(p => { if(p.category === cat) p.category = categories[1] || '전체'; });
            localStorage.setItem('categories', JSON.stringify(categories));
            localStorage.setItem('places', JSON.stringify(places));
            renderCategoryAdmin();
        });
    };

    /* --- 검색 및 실시간 결과 리스트 --- */
    const searchInput = document.getElementById('searchInput');
    const searchDropdown = document.getElementById('search-results-dropdown');
    const clearSearchBtn = document.getElementById('clear-search-btn');

    // 검색어 하이라이트 표시 함수
    function highlightMatch(text, query) {
        if (!query) return text;
        const reg = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        return text.replace(reg, '<span class="text-blue-600 font-extrabold">$1</span>');
    }

    // 드롭다운 리스트 렌더링
    function renderSearchResults(results, query) {
        if (!query.trim()) {
            searchDropdown.classList.add('hidden');
            searchDropdown.innerHTML = '';
            clearSearchBtn.classList.add('hidden');
            return;
        }

        clearSearchBtn.classList.remove('hidden');
        searchDropdown.innerHTML = '';

        if (results.length === 0) {
            searchDropdown.innerHTML = `
                <div class="p-5 text-center text-sm text-gray-400">
                    일치하는 장소가 없습니다.
                </div>
            `;
            searchDropdown.classList.remove('hidden');
            return;
        }

        results.forEach(place => {
            const item = document.createElement('div');
            item.className = 'flex items-center gap-3.5 p-3.5 hover:bg-gray-50/80 active:bg-gray-100/80 cursor-pointer transition';
            
            const thumbHtml = place.image ? 
                `<img src="${place.image}" class="w-10 h-10 rounded-xl object-cover flex-shrink-0 border border-gray-100 shadow-sm" />` :
                `<div class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center text-gray-500 flex-shrink-0">
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </div>`;

            const displayTitle = getDisplayTitle(place.title);
            const displayCat = getDisplayCategory(place.category);

            item.innerHTML = `
                ${thumbHtml}
                <div class="flex-1 min-w-0">
                    <div class="text-[15px] font-bold text-gray-900 truncate">
                        ${highlightMatch(displayTitle, query)}
                    </div>
                    <div class="text-xs text-blue-500 font-semibold mt-0.5 truncate">
                        #${highlightMatch(displayCat, query)}
                    </div>
                </div>
                <div class="text-gray-300 flex-shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </div>
            `;

            // 목록 항목 클릭 시: 지도 이동 및 바텀시트 오픈
            item.addEventListener('click', () => {
                searchDropdown.classList.add('hidden');
                searchInput.value = displayTitle;
                clearSearchBtn.classList.remove('hidden');

                // 해당 장소로 부드럽게 날아가기 (애니메이션 이동)
                map.flyTo([place.lat, place.lng], 17, { animate: true, duration: 0.8 });

                // 상세 창 즉시 열기
                openBottomSheet(place);
            });

            searchDropdown.appendChild(item);
        });

        searchDropdown.classList.remove('hidden');
    }

    searchInput.addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase().trim();
        markersLayer.clearLayers();
        
        const filtered = places.filter(p => {
            const dTitle = getDisplayTitle(p.title).toLowerCase();
            const dCat = getDisplayCategory(p.category).toLowerCase();
            return p.title.toLowerCase().includes(val) || 
                   p.category.toLowerCase().includes(val) || 
                   dTitle.includes(val) || 
                   dCat.includes(val);
        });

        filtered.forEach(place => {
            const marker = L.marker([place.lat, place.lng], { icon: getCustomIcon(place) });
            marker.on('click', () => openBottomSheet(place));
            markersLayer.addLayer(marker);
        });

        renderSearchResults(filtered, val);
    });

    // 검색어 지우기 버튼
    clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        clearSearchBtn.classList.add('hidden');
        searchDropdown.classList.add('hidden');
        renderMarkers();
    });

    // 검색창 바깥을 터치하면 리스트 닫기
    document.addEventListener('click', (e) => {
        if (!e.target.closest('#searchInput') && !e.target.closest('#search-results-dropdown') && !e.target.closest('#clear-search-btn')) {
            searchDropdown.classList.add('hidden');
        }
    });

    // 검색창 재포커스 시 검색어가 남아있으면 다시 표시
    searchInput.addEventListener('focus', () => {
        const val = searchInput.value.toLowerCase().trim();
        if (val) {
            const filtered = places.filter(p => 
                p.title.toLowerCase().includes(val) || p.category.toLowerCase().includes(val)
            );
            renderSearchResults(filtered, val);
        }
    });

    // 초기 실행
    applyTranslations();
    renderMarkers();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>우리동네 스팟 공유</title>
    
    <!-- PWA 매니페스트 및 서비스 워커 등록 -->
    <link rel="manifest" id="manifest-link">
    <script>
        const manifest = {
            "name": "우리동네 스팟 공유",
            "short_name": "스팟공유",
            "start_url": "./",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#ffffff",
            "icons": [
                {
                    "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ef4444'/><polygon points='40,30 70,50 40,70' fill='white'/></svg>",
                    "sizes": "192x192 512x512",
                    "type": "image/svg+xml"
                }
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
        document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', (e) => self.skipWaiting());
                self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
                self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
            `;
            const swBlob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
        }
    </script>

    <!-- UI 스타일 및 지도 라이브러리 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- 구글 파이어베이스 SDK (v10 호환 모드) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <style>
        body { 
            margin: 0; padding: 0; 
            overscroll-behavior-y: none;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        .app-container {
            height: 100vh; height: 100dvh; 
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #map { 
            flex-grow: 1; 
            width: 100%; 
            z-index: 10;
            filter: contrast(0.95) saturate(0.85) brightness(1.05);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 줌 컨트롤러(+,-) 완전 차단 */
        .leaflet-control-zoom { display: none !important; }

        .marker-pulse { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .gps-pulse {
            width: 16px; height: 16px;
            background: #2563eb;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.8);
            position: relative;
        }
        .gps-pulse::after {
            content: '';
            position: absolute;
            top: -6px; left: -6px;
            right: -6px; bottom: -6px;
            border: 2px solid #3b82f6;
            border-radius: 50%;
            animation: gps-wave 1.8s infinite ease-out;
        }
        @keyframes gps-wave {
            0% { transform: scale(0.6); opacity: 1; }
            100% { transform: scale(2.2); opacity: 0; }
        }
    </style>
</head>
<body>

<!-- 모달 & 바텀시트 UI -->

<!-- 관리자 인증 모달 -->

</div>

<!-- 상세 바텀시트 -->

            </div>

            <button id="save-place-btn" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl text-lg shadow-md active:bg-blue-700">

<!-- 카테고리 관리 모달 -->
<div id="category-admin-modal" class="hidden fixed inset-0 z-[300] bg-black/50 flex items-center justify-center p-4">

</div>

    let userLocationMarker = null;

    document.getElementById('gps-btn').addEventListener('click', () => {
        if (!navigator.geolocation) {
            showAlert(i18n[currentLang].gpsGeneral);
            return;
        }

        const gpsSuccess = (pos) => {
            const { latitude, longitude, accuracy } = pos.coords;
            const latlng = [latitude, longitude];

            if (userLocationMarker) map.removeLayer(userLocationMarker);
            if (userAccuracyCircle) map.removeLayer(userAccuracyCircle);

            const pulseIcon = L.divIcon({
                className: '',
                html: '<div class="gps-pulse"></div>',
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });

            userLocationMarker = L.marker(latlng, { icon: pulseIcon }).addTo(map);
            userAccuracyCircle = L.circle(latlng, { radius: accuracy, color: '#3b82f6', fillColor: '#93c5fd', fillOpacity: 0.15, weight: 1 }).addTo(map);

            map.flyTo(latlng, 17, { animate: true, duration: 1.2 });
        };

        const gpsError = (err) => {
            let msg = i18n[currentLang].gpsGeneral;
            if (err.code === 1) msg = i18n[currentLang].gpsDenied;
            else if (err.code === 2) msg = i18n[currentLang].gpsUnavailable;
            else if (err.code === 3) msg = i18n[currentLang].gpsTimeout;
            showAlert(msg);
        };

        navigator.geolocation.getCurrentPosition(gpsSuccess, () => {
            navigator.geolocation.getCurrentPosition(gpsSuccess, gpsError, { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 });
        }, { enableHighAccuracy: true, timeout: 6000, maximumAge: 0 });
    });

    /* --- 6. SHA-256 해시 비밀번호 로직 --- */
    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    const TARGET_PASSWORD_HASH = 'e93e38bec834d416f993be047fc77eae91b774b9ae62d0f78594b1a7e3a4dd7f';

            clickCount = 0;

    });

    document.getElementById('submit-password-btn').addEventListener('click', async () => {

        const inputHash = await sha256(inputVal);

            creatorUnlocked = true;

            document.getElementById('password-modal').classList.add('hidden');

            }`;
            
            const displayCat = cat === '전체' ? i18n[currentLang].all : translateText(cat);
            let count = (cat === '전체') ? places.length : places.filter(p => p.category === cat).length;
            btn.innerHTML = `${cat === '전체' ? '🌐 ' + displayCat : '#' + displayCat} <span class="${isActive ? 'text-gray-300' : 'text-gray-400'} ml-1">${count}</span>`;

        const select = document.getElementById('input-category');
        select.innerHTML = categories.filter(c => c !== '전체').map(c => `<option value="${c}">${c}</option>`).join('');

    function getCustomIcon(place) {
        const translatedTitle = translateText(place.title);
        let pinInner = place.image ? 
            `<div class="w-13 h-13 w-[52px] h-[52px] rounded-full border-[3px] border-white shadow-md overflow-hidden relative bg-gray-200">
                <img src="${place.image}" class="w-full h-full object-cover"/>
                <div class="absolute bottom-0 right-0 bg-red-500 rounded-full w-4 h-4 flex items-center justify-center border border-white">
                    <span class="text-[8px] text-white ml-[1px]">▶</span>
                </div>
            </div>` : 
            `<div class="w-10 h-10 bg-red-500 rounded-full border-2 border-white shadow-md flex items-center justify-center text-white text-sm">▶</div>`;
        
        const htmlStr = `
            <div class="flex flex-col items-center cursor-pointer pointer-events-auto">
                ${pinInner}
                <div class="mt-1 px-2.5 py-0.5 bg-gray-900/80 backdrop-blur-sm text-white text-[11px] font-bold rounded-full shadow-sm max-w-[110px] truncate text-center border border-white/20">
                    ${translatedTitle}
                </div>
            </div>

        return L.divIcon({
            html: htmlStr,
            className: 'custom-spot-marker',
            iconSize: [110, place.image ? 80 : 68],

    function renderMarkers() {
        markersLayer.clearLayers();
        let filtered = currentFilter === '전체' ? places : places.filter(p => p.category === currentFilter);
        filtered.forEach(place => {
            if (place.lat && place.lng) {

    /* --- 8. 검색 목록 & 하이라이트 --- */
    const searchInput = document.getElementById('searchInput');

    searchInput.addEventListener('input', (e) => {
        const val = e.target.value.trim().toLowerCase();
        searchClearBtn.classList.toggle('hidden', val.length === 0);

        if (!val) {
            searchSuggestions.classList.add('hidden');
            renderMarkers();
            return;
        }

        const filtered = places.filter(p => {
            const tTitle = translateText(p.title || '').toLowerCase();
            const tCat = translateText(p.category || '').toLowerCase();
            return (p.title && p.title.toLowerCase().includes(val)) || 
                   (p.category && p.category.toLowerCase().includes(val)) || 
                   tTitle.includes(val) || 
                   tCat.includes(val);
        });

        if (filtered.length === 0) {
            searchSuggestions.innerHTML = `<div class="p-4 text-center text-xs text-gray-400">일치하는 장소가 없습니다.</div>`;
            searchSuggestions.classList.remove('hidden');
            return;
        }

        searchSuggestions.innerHTML = filtered.map(p => {
            const dispTitle = translateText(p.title || '');
            const dispCat = translateText(p.category || '');
            
            const regex = new RegExp(`(${val})`, 'gi');
            const highlightedTitle = dispTitle.replace(regex, '<span class="text-blue-600 font-extrabold">$1</span>');

                `<div class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center flex-shrink-0 text-red-500 font-bold text-base">📍</div>`;

            return `

        }).join('');

        searchSuggestions.classList.remove('hidden');

    /* --- 10. 사진 압축 처리 --- */
    document.getElementById('input-photo').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                let width = img.width, height = img.height;
                if (width > 800) { height *= 800 / width; width = 800; }
                canvas.width = width; canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);
                tempCompressedImage = canvas.toDataURL('image/jpeg', 0.7);
                
                document.getElementById('photo-preview').src = tempCompressedImage;
                document.getElementById('photo-preview-container').classList.remove('hidden');
                document.getElementById('photo-placeholder').classList.add('hidden');
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    function resetPhotoUpload() {
        document.getElementById('input-photo').value = '';
        tempCompressedImage = null;

    document.getElementById('save-place-btn').addEventListener('click', () => {
        const title = document.getElementById('input-title').value.trim();
        const category = document.getElementById('input-category').value;
        const link = document.getElementById('input-link').value.trim();

        if(!title) return showAlert('장소명을 입력해주세요.');
        if(!link) return showAlert('링크를 입력해주세요.');

        const saveBtn = document.getElementById('save-place-btn');
        saveBtn.disabled = true;
        saveBtn.textContent = "저장 중...";

        const placeData = {
            title,
            category,
            link,
            image: tempCompressedImage || (editingId && currentOpenPlace ? currentOpenPlace.image : null),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        if (editingId) {
            if (currentTempLocation) {
                placeData.lat = currentTempLocation.lat;
                placeData.lng = currentTempLocation.lng;
            }
            db.collection("places").doc(editingId).update(placeData).then(() => {
                saveBtn.disabled = false;
                saveBtn.textContent = "저장하기";
                document.getElementById('place-form-modal').classList.add('hidden');
            }).catch(err => {
                saveBtn.disabled = false;
                saveBtn.textContent = "저장하기";
                showAlert("수정 중 오류가 발생했습니다: " + err.message);
            });
        } else {
            placeData.lat = currentTempLocation.lat;
            placeData.lng = currentTempLocation.lng;
            placeData.createdAt = firebase.firestore.FieldValue.serverTimestamp();

            db.collection("places").add(placeData).then(() => {
                saveBtn.disabled = false;
                saveBtn.textContent = "저장하기";
                document.getElementById('place-form-modal').classList.add('hidden');
            }).catch(err => {
                saveBtn.disabled = false;
                saveBtn.textContent = "저장하기";
                showAlert("등록 중 오류가 발생했습니다: " + err.message);

                <div class="flex gap-1.5 flex-shrink-0">

                    <button class="text-xs bg-red-50 text-red-600 px-2.5 py-1.5 rounded-lg font-bold" onclick="deleteCategory('${cat}')">삭제</button>

    document.getElementById('add-category-btn').addEventListener('click', () => {
        const val = document.getElementById('new-category-input').value.trim();
        if(val && !categories.includes(val)) {
            categories.push(val);
            db.collection("meta").doc("categories").update({ list: categories }).then(() => {
                document.getElementById('new-category-input').value = '';
                renderCategoryAdmin();
            });
        }
    });

    window.updateCategory = (oldCat) => {
        const val = document.getElementById(`cat-edit-${oldCat}`).value.trim();
        if(val && val !== oldCat && !categories.includes(val)) {
            const idx = categories.indexOf(oldCat);
            categories[idx] = val;
            db.collection("meta").doc("categories").update({ list: categories }).then(() => {
                renderCategoryAdmin();
            });
        }
    };

    window.deleteCategory = (cat) => {
        if(confirm(`'${cat}' 카테고리를 삭제할까요?`)) {
            categories = categories.filter(c => c !== cat);
            db.collection("meta").doc("categories").update({ list: categories }).then(() => {
                renderCategoryAdmin();
            });
        }
    };

    // 초기 언어 실행
    applyLanguageUI();
});
</script>
</body>
</html>
